[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-router-backend"
version = "0.1.0"
description = "Voice Router hackathon foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "openai-agents>=0.22.3,<1",
    "openai>=3.19,<4",
    "uvicorn>=0.35,<1",
    "websockets>=15,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
voice = ["faster-whisper==1.2.1"]

[project.scripts]
voice-router = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["dev_stand/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
